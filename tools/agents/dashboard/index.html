<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajanlar</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --line: #e3e0da; --text: #1f1d1a; --muted: #6f6a62;
    --accent: #2f6fdb; --ok: #2e8b57; --warn: #c7811a; --bad: #c2413b; --idle: #8a8478;
    --bar: #ece9e3; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17161a; --card: #1f1e23; --line: #33313a; --text: #ecebee; --muted: #9b98a3;
      --accent: #6ea0ff; --ok: #4fbf82; --warn: #e3a440; --bad: #ef6a63; --idle: #8b8794; --bar: #2b2a31; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  .stat { display: flex; flex-direction: column; }
  .stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .stat span, .muted { color: var(--muted); font-size: 12px; }
  .limits { display: flex; gap: 16px; flex-wrap: wrap; }
  .limit { min-width: 150px; }
  main { padding: 16px 20px 40px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  @media (max-width: 600px) { header { position: static; } main { grid-template-columns: 1fr; padding: 12px 16px 32px; } header { padding: 12px 16px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 650; font-size: 15px; }
  .role { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; }
  .badge { margin-left: auto; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 10px; color: #fff; }
  .s-working { background: var(--ok); } .s-waiting { background: var(--warn); } .s-idle { background: var(--idle); }
  .s-offline, .s-ended, .s-unknown { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .card.need { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad), 0 0 18px -4px var(--bad); }
  .activity { font-family: var(--mono); font-size: 12.5px; background: var(--bar); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; }
  .waiting { border-left: 3px solid var(--warn); padding-left: 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .meter { height: 6px; background: var(--bar); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .meter i.hi { background: var(--warn); } .meter i.max { background: var(--bad); }
  .kv { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .kv b { color: var(--text); font-weight: 500; }
  textarea { width: 100%; min-height: 58px; resize: vertical; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { font-family: var(--mono); font-size: 11.5px; background: var(--bar); border-radius: 6px; padding: 8px; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; }
  ul.events { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; max-height: 180px; overflow: auto; }
  ul.events li { padding: 2px 0; border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  ul.events time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .tests { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .t-passed { color: var(--ok); } .t-failed, .t-error { color: var(--bad); } .t-running { color: var(--warn); }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px; }
  .err { color: var(--bad); font-size: 12px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>Ajanlar</h1>
  <div class="stat"><b id="active">–</b><span>çalışıyor / bekliyor</span></div>
  <div class="stat"><b id="today">–</b><span>bugün (API karşılığı)</span></div>
  <div class="stat"><b id="total">–</b><span>toplam (API karşılığı)</span></div>
  <div class="limits" id="limits"></div>
  <span class="muted" id="updated" style="margin-left:auto"></span>
</header>
<main id="main"><div class="empty">Yükleniyor…</div></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const usd = (n) => (n == null ? '–' : '$' + n.toFixed(2));
const STATE = { working: 'Çalışıyor', waiting: 'Seni bekliyor', idle: 'Boşta', offline: 'Panel yok', ended: 'Kapandı', unknown: '?' };
const drafts = {}; const openPanes = new Set(); const openEvents = new Set();

function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return Math.round(s) + ' sn önce';
  if (s < 3600) return Math.round(s / 60) + ' dk önce';
  if (s < 86400) return Math.round(s / 3600) + ' sa önce';
  return Math.round(s / 86400) + ' gün önce';
}
const clock = (iso) => new Date(iso).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function meter(pct) {
  if (pct == null) return '<div class="meter"></div>';
  const cls = pct >= 85 ? 'max' : pct >= 60 ? 'hi' : '';
  return `<div class="meter"><i class="${cls}" style="width:${Math.min(100, pct)}%"></i></div>`;
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CG-Dash': '1' }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function limitsHtml(rl) {
  if (!rl || typeof rl !== 'object') return '';
  const label = { five_hour: '5 saatlik limit', seven_day: 'Haftalık limit', seven_day_opus: 'Haftalık (Opus)' };
  return Object.entries(rl).filter(([, v]) => v && typeof v === 'object').map(([k, v]) => {
    const pct = v.used_percentage ?? v.utilization ?? null;
    const reset = v.resets_at ? `, sıfırlanma ${new Date(typeof v.resets_at === 'number' ? v.resets_at * 1000 : v.resets_at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}` : '';
    return `<div class="limit stat"><span>${esc(label[k] || k)}: ${pct == null ? '?' : Math.round(pct) + '%'}${reset}</span>${meter(pct)}</div>`;
  }).join('');
}

function card(a) {
  const ctx = a.context || {};
  const ctxText = ctx.usedPct == null ? '–' : `${Math.round(ctx.usedPct)}%`;
  const tokens = ctx.usedTokens ? `${Math.round(ctx.usedTokens / 1000)}k / ${Math.round((ctx.size || 0) / 1000)}k` : '';
  const waiting = a.state === 'waiting';
  return `<section class="card${waiting ? ' need' : ''}" data-agent="${esc(a.name)}">
    <div class="top"><span class="name">${esc(a.name)}</span>${a.role ? `<span class="role">${esc(a.role)}</span>` : ''}
      <span class="badge s-${a.state}">${STATE[a.state] || a.state}</span></div>
    <div class="activity">${esc(a.activity || '—')}<div class="muted">${ago(a.updatedAt)}</div></div>
    ${waiting && a.lastMessage ? `<div class="waiting">${esc(a.lastMessage)}</div>` : ''}
    <div class="grid">
      <div class="stat"><span>Bağlam</span><b>${ctxText}</b>${meter(ctx.usedPct)}<span>${tokens}</span></div>
      <div class="stat"><span>Bu oturum</span><b>${usd(a.cost?.session)}</b><span>${a.cost?.linesAdded != null ? `+${a.cost.linesAdded} / −${a.cost.linesRemoved ?? 0} satır` : ''}</span></div>
      <div class="stat"><span>Bugün / toplam</span><b>${usd(a.cost?.today)}</b><span>${usd(a.cost?.total)} · ${a.cost?.sessions || 0} oturum</span></div>
    </div>
    <div class="kv">Model <b>${esc(a.model || '–')}</b> · Branch <b>${esc(a.branch || '–')}</b>${a.paneTarget ? ` · tmux <b>${esc(a.paneTarget)}</b>` : ''}</div>
    ${a.lastPrompt ? `<div class="kv">Son prompt (${ago(a.lastPromptAt)}): <b>${esc(a.lastPrompt)}</b></div>` : ''}
    <textarea placeholder="${a.canSend ? 'Prompt yaz, ⌘/Ctrl + Enter ile gönder' : 'Bu ajan bir tmux panelinde çalışmıyor'}" ${a.canSend ? '' : 'disabled'}>${esc(drafts[a.name] || '')}</textarea>
    <div class="row">
      <button class="primary" data-act="send" ${a.canSend ? '' : 'disabled'}>Gönder</button>
      ${waiting ? `<button data-act="key" data-key="enter" title="İzin sorusunda seçili seçeneği onaylar">Onayla (Enter)</button>` : ''}
      <button data-act="key" data-key="escape" ${a.canSend ? '' : 'disabled'} title="Çalışan turu durdurur ya da izin sorusunu reddeder">Durdur (Esc)</button>
      <button data-act="pane" ${a.canSend ? '' : 'disabled'}>${openPanes.has(a.name) ? 'Ekranı gizle' : 'Ekranı göster'}</button>
      ${!a.canSend ? `<button data-act="forget" title="Kayıtlarını siler">Listeden kaldır</button>` : ''}
      <span class="err"></span>
    </div>
    ${openPanes.has(a.name) ? `<pre class="pane">…</pre>` : ''}
    <details ${openEvents.has(a.name) ? 'open' : ''}><summary>Son olaylar (${a.events.length})</summary>
      <ul class="events">${a.events.map((e) => `<li><time>${clock(e.at)}</time>${esc(e.text)}</li>`).join('')}</ul></details>
  </section>`;
}

function testsHtml(tests) {
  if (!tests.length) return '';
  return `<section class="card tests"><div class="top"><span class="name">Test klasörü</span><span class="muted">son ${tests.length} koşu</span></div>
    <div class="table-wrap"><table><tr><th>Ne zaman</th><th>Branch</th><th>Tür</th><th>Sonuç</th><th>Geçti / toplam</th><th>Süre</th><th>Log</th></tr>
    ${tests.map((t) => `<tr><td>${ago(t.startedAt)}</td><td>${esc(t.branch)} <span class="muted">${esc((t.commit || '').slice(0, 7))}</span></td><td>${esc(t.kind)}</td>
      <td class="t-${esc(t.status)}">${esc({ passed: 'Geçti', failed: 'Kaldı', error: 'Hata', running: 'Çalışıyor' }[t.status] || t.status)}</td>
      <td>${t.total == null ? '–' : `${t.passed ?? 0} / ${t.total}${t.failed ? ` (${t.failed} kaldı)` : ''}`}</td>
      <td>${t.seconds != null ? t.seconds + ' sn' : ''}</td><td class="muted">${esc(t.log || '')}</td></tr>`).join('')}
    </table></div></section>`;
}

let busy = false;
async function refresh() {
  if (busy) return;
  // Do not re-render while the user is typing in a box.
  if (document.activeElement?.tagName === 'TEXTAREA') return;
  busy = true;
  try {
    const s = await api('/api/state');
    const active = s.agents.filter((a) => a.state === 'working').length;
    const waiting = s.agents.filter((a) => a.state === 'waiting').length;
    $('#active').textContent = `${active} / ${waiting}`;
    $('#today').textContent = usd(s.agents.reduce((n, a) => n + (a.cost?.today || 0), 0));
    $('#total').textContent = usd(s.agents.reduce((n, a) => n + (a.cost?.total || 0), 0));
    $('#limits').innerHTML = limitsHtml(s.rateLimits);
    $('#updated').textContent = 'güncellendi ' + clock(s.now);
    document.title = waiting ? `(${waiting}) Ajanlar` : 'Ajanlar';
    $('#main').innerHTML = s.agents.length
      ? s.agents.map(card).join('') + testsHtml(s.tests)
      : `<div class="empty">Henüz ajan yok. Terminalde <code>./cg agents up</code> çalıştır.</div>` + testsHtml(s.tests);
    for (const name of openPanes) loadPane(name);
  } catch (e) {
    $('#updated').textContent = 'bağlantı yok: ' + e.message;
  } finally {
    busy = false;
  }
}

async function loadPane(name) {
  const pre = $(`[data-agent="${CSS.escape(name)}"] pre.pane`);
  if (!pre) return;
  try { pre.textContent = (await api('/api/pane?agent=' + encodeURIComponent(name))).text || '(boş)'; pre.scrollTop = pre.scrollHeight; }
  catch (e) { pre.textContent = e.message; }
}

async function send(cardEl) {
  const name = cardEl.dataset.agent; const box = $('textarea', cardEl); const err = $('.err', cardEl);
  const text = box.value.trim(); if (!text) return;
  err.textContent = '';
  try { await api('/api/send', { agent: name, text }); box.value = ''; delete drafts[name]; box.blur(); setTimeout(refresh, 400); }
  catch (e) { err.textContent = e.message; }
}

document.addEventListener('input', (e) => { const c = e.target.closest('.card'); if (c && e.target.tagName === 'TEXTAREA') drafts[c.dataset.agent] = e.target.value; });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(e.target.closest('.card')); }
  if (e.target.tagName === 'TEXTAREA' && e.key === 'Escape') e.target.blur();
});
document.addEventListener('toggle', (e) => {
  const c = e.target.closest?.('.card'); if (!c || e.target.tagName !== 'DETAILS') return;
  e.target.open ? openEvents.add(c.dataset.agent) : openEvents.delete(c.dataset.agent);
}, true);
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const c = btn.closest('.card'); const name = c.dataset.agent; const err = $('.err', c);
  try {
    if (btn.dataset.act === 'send') return send(c);
    if (btn.dataset.act === 'key') { await api('/api/key', { agent: name, key: btn.dataset.key }); setTimeout(refresh, 400); }
    if (btn.dataset.act === 'pane') { openPanes.has(name) ? openPanes.delete(name) : openPanes.add(name); busy = false; refresh(); }
    if (btn.dataset.act === 'forget') { await api('/api/forget', { agent: name }); refresh(); }
  } catch (ex) { err.textContent = ex.message; }
});

refresh();
setInterval(refresh, 2000);
setInterval(() => { if (document.activeElement?.tagName !== 'TEXTAREA') for (const n of openPanes) loadPane(n); }, 1000);
</script>
</body>
</html>
