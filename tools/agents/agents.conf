# Which agents `./cg agents up` starts, one per line (one tmux pane each).
#   name      agent        folder     permission mode   model
# agent:  .claude/agents/<agent>.md
# folder: main = the repo itself, wt:<name> = a git worktree for that developer
#         (created next to the repo on first start)
# model:  haiku | sonnet | opus, or - for the agent file's default. The dashboard can
#         also switch a running agent's model (it types /model into its pane).
# Add "dev2 developer wt:dev2 acceptEdits -" for a second developer; on the Pro plan one is usually enough.
planner   planner     main      default       -
dev1      developer   wt:dev1   acceptEdits   -
tester    tester      main      default       -
